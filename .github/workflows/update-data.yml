name: Data bijwerken

on:
  schedule:
    # Elke maandag om 06:20 UTC. De gekleurde jaarlijnen zijn maandgemiddelden
    # en veranderen maar een keer per maand; alleen de lopende maand kruipt er
    # dagelijks bij, en die mag gerust een week achterlopen.
    - cron: "20 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reeksen ophalen bij NOAA
        run: python scripts/fetch_sst.py

      - name: Committen als er iets veranderd is
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Geen nieuwe dagen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Data bijgewerkt tot $(date -u +%F)"
          git push
